  <text x="624" y="382" text-anchor="middle" font-size="11" fill="#854F0B">presigned PUT / GET</text>

  <line x1="390" y1="82" x2="390" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ah)"/>
