  <text x="390" y="382" text-anchor="middle" font-size="11" fill="#0F6E56">matches the photo</text>

  <rect x="502" y="318" width="244" height="74" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
