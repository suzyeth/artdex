  <text x="156" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#042C53">Amazon DynamoDB</text>
  <text x="156" y="366" text-anchor="middle" font-size="12" fill="#0C447C">catalog &#183; collections &#183; moments</text>
  <text x="156" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#185FA5">the judged core</text>
