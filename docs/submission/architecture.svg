      <path d="M0 0 L10 5 L0 10 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect x="285" y="20" width="210" height="62" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
