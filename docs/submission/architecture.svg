  <text x="390" y="198" text-anchor="middle" font-size="12" fill="#534AB7">recognize &#183; candidates &#183; collect</text>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#534AB7">collection &#183; search &#183; upload-url</text>

